name: Lab4 - Container Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t workshop-app:${{ github.sha }} .
      - name: Scan Dockerfile and config (misconfigurations)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Scan image (OS and library CVEs)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: workshop-app:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
